/* ── ONBOARDING ──────────────────────────────────────────────────
   Three screens, one minute, then out of the way forever. The goal is a
   member who knows the one rule (rep is earned) and has a face. */
function onboardHTML(){
  const dots=`<div class="onb-dots">${[1,2,3].map(i=>`<span class="${ONBOARD===i?"on":""}"></span>`).join("")}</div>`;
  if(ONBOARD===1)return `<div class="ui-ov"><div class="ui-card">
    <div class="mono dim" style="letter-spacing:.16em">WELCOME TO</div>
    <div class="ui-title" style="font-size:26px;margin-top:4px">LABS 🧪</div>
    <div class="ui-body">A workshop, not a feed.
Post the half-finished version — this is where it gets finished.
Work made together rises. That's the algorithm.
Rep is earned, not spent. Nothing here is for sale but the work.</div>
    ${dots}<div class="ui-btns"><button class="ui-btn ui-ok" data-onb="2">Next</button></div>
  </div></div>`;
  if(ONBOARD===2)return `<div class="ui-ov"><div class="ui-card">
    <div class="ui-title">Make it yours</div>
    <div class="ui-body">A face and a line — so when your work travels, people know whose it is.</div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
      ${avHTML(ME,"")}<button class="btn ghost" id="onbavb">Add a photo</button>
      <input type="file" id="onbav" accept="image/*" hidden>
    </div>
    <input class="ui-in" id="onbbio" placeholder="What do you make? One line." value="${esc(ME&&ME.bio||"")}">
    ${dots}<div class="ui-btns">
      <button class="ui-btn ui-cancel" data-onb="3">Skip</button>
      <button class="ui-btn ui-ok" id="onbsave">Save &amp; continue</button>
    </div>
  </div></div>`;
  return `<div class="ui-ov"><div class="ui-card">
    <div class="ui-title">How you rise</div>
    <div class="ui-body">Standing moves only when others act on your work:
likes +6 · shares +3 · collabs +20 · sales +15 · delivered +10.
As you climb L1→L5, rooms unlock and your cut when you sell grows from 90% to 98%.</div>
    ${dots}<div class="ui-btns"><button class="ui-btn ui-ok" id="onbdone">Enter the Showroom</button></div>
  </div></div>`;
}
function wireOnboard(){
  document.querySelectorAll("[data-onb]").forEach(b=>b.onclick=()=>{ONBOARD=+b.dataset.onb;render()});
  const avb=$("#onbavb"),avf=$("#onbav");
  if(avb&&avf){avb.onclick=()=>avf.click();
    avf.onchange=async()=>{const file=avf.files[0];if(!file)return;
      try{const data=await compressImage(file,500,.85);const d=await api.avatar(data);ME.avatarUrl=d.avatarUrl||d.url||ME.avatarUrl;render()}
      catch(e){toast(e.message)}};}
  const sv=$("#onbsave");if(sv)sv.onclick=async()=>{
    const bio=($("#onbbio")||{}).value||"";
    try{if(bio.trim()&&bio!==(ME.bio||"")){await api.updateMe({bio:bio.trim()});ME.bio=bio.trim()}}catch(e){}
    ONBOARD=3;render();
  };
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{setTheme(b.dataset.themeSet);render()});
  const dn=$("#onbdone");if(dn)dn.onclick=()=>{ONBOARD=0;TAB="showroom";render();setTimeout(maybeOfferInstall,600)};
}

function wirePicker(){
  const bg=$("#pickbg");if(!bg)return;
  bg.onclick=e=>{if(e.target===bg)closePicker()};
  const x=$("#pickx");if(x)x.onclick=closePicker;
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const it=PICKER.items[+b.dataset.pick];
    const fn=PICKER.onPick;
    closePicker();
    if(fn)fn(it);
  });
  const q=$("#pickq");
  if(q){
    q.focus();
    let t=null;
    q.oninput=()=>{
      PICKER.q=q.value;
      if(!PICKER.onSearch)return;
      clearTimeout(t);
      t=setTimeout(async()=>{
        const mine=PICKER.q;
        PICKER.loading=true;render();
        const items=await PICKER.onSearch(mine);
        if(!PICKER||PICKER.q!==mine)return;
        PICKER.items=items;PICKER.loading=false;render();
      },200);
    };
  }
}

function timeAgo(t){const s=(Date.now()-t)/1000;
  if(s<60)return "JUST NOW";if(s<3600)return Math.floor(s/60)+"M AGO";
  if(s<86400)return Math.floor(s/3600)+"H AGO";if(s<604800)return Math.floor(s/86400)+"D AGO";
  return new Date(t).toLocaleDateString().toUpperCase()}

/* Missing video, blocked playback, a stalled network — every one of those
   ends in done(), never in a locked screen. The 20s timer is the last resort. */
function enterHTML(){
  const mark = (document.querySelector(".mark")||{}).src || "";
  /* First visit gets the film. Every visit after that gets the same door
     with no video behind it: the mark, the button, one tap, straight in.
     wireEnter already treats a missing video as "nothing to wait for" and
     goes on the tap, so omitting the element IS the fast path. */
  let seen=false; try{ seen = !!localStorage.getItem("tnl-intro-seen") }catch(e){}
  return `<div class="enter${seen?" quick":""}" id="enterOv">
    ${seen?"":`<video class="enter-v" id="enterVid" playsinline preload="metadata"
      poster="/tnl-enter-poster.jpg" src="/tnl-enter.mp4"></video>`}
    <div class="enter-c" id="enterC">
      ${mark?`<img class="enter-m" src="${mark}" alt="TNL">`:""}
      <button class="enter-b" id="enterBtn">ENTER THE LAB</button>
    </div>
    ${seen?"":`<button class="enter-s" id="enterSkip" style="position:absolute;right:14px;bottom:18px;z-index:2">SKIP</button>`}
  </div>`;
}

function wireEnter(){
  if(!ENTER)return;
  const ov=$("#enterOv"); if(!ov)return;
  const v=$("#enterVid"), c=$("#enterC");
  let gone=false, started=false;
  const done=()=>{
    if(gone)return; gone=true;
    /* localStorage, not sessionStorage: the film is a once-per-device
       moment, while the door itself returns every load to carry the tap. */
    try{ localStorage.setItem("tnl-intro-seen","1") }catch(e){}
    ENTER=false; render();
  };
  const go=()=>{
    /* Synchronous inside the gesture. An await here and iOS stops counting
       this as a tap, which is the whole reason the door exists. */
    /* Synchronous inside the gesture — one shared unlock, no second copy to
       drift. skipWire: done() -> render() wires the observer once the
       overlay is gone, so nothing autoplays behind the intro. */
    primeAudio(true);
    if(v){
      v.muted=false;
      const p=v.play();
      if(p&&p.catch)p.catch(done);
      if(c)c.style.display="none";
    } else done();
    started=true;
  };
  const eb=$("#enterBtn"); if(eb)eb.onclick=go;
  /* 073 removed SKIP from the repeat-visit door but left this wiring
     unconditional — $("#enterSkip") was null on every visit after the
     first, and the resulting TypeError killed the whole boot. Both
     lookups are guarded now; a door element that isn't rendered is a
     door element that doesn't get wired. */
  const es=$("#enterSkip"); if(es)es.onclick=done;
  /* Before ENTER is pressed these must NOT dismiss. preload="metadata" fetches
     the file the moment this renders, so a video that is missing or slow fired
     onerror instantly and closed the door before anyone could touch it. Until
     the tap, a broken video just hides itself and the button stands. */
  if(v){
    v.onerror=()=>{ if(started)done(); else v.style.display="none"; };
    v.onstalled=()=>{ if(started)done(); };
    v.onended=done;
  }
  setTimeout(()=>{ if(started)done(); },20000);
}

function wireGate(){

  const body=()=>$("#gatebody");
  function draw(){

      <h1>Reset password.</h1><p>We'll email you a link. It works for one hour.</p>
      <label class="mono lbl">EMAIL</label><input class="in" id="fe" type="email" placeholder="you@example.com">

      <button class="btn wide" id="fgo">Send reset link</button>

        const em=$("#fe").value.trim();
        if(!/^\S+@\S+\.\S+$/.test(em)){err="Enter a valid email.";return draw()}
        try{const d=await api.forgot(em);
          if(d.resetUrl){body().innerHTML=`<h1>Mail not set up.</h1><p>Email isn't configured yet, so here's your link:</p>
            <a class="btn wide" style="text-decoration:none" href="${esc(d.resetUrl)}">Set new password</a>`;}
          else body().innerHTML=`<h1>Check your email.</h1><p>If that address has an account, a reset link is on the way.</p>`;
        }catch(e){err=e.message;draw()}};
      return}
    if(mode==="login"){body().innerHTML=`
      <h1>Log in.</h1><p>Back to the lab.</p>
      <label class="mono lbl">USERNAME</label><input class="in" id="u" value="${esc(f.username)}">
      <label class="mono lbl">PASSWORD</label><input class="in" id="p" type="password">
      ${err?`<div class="err">${esc(err)}</div>`:""}

      <p style="margin-top:12px;font-size:12px" class="dim"><span class="switch" id="fp">Forgot password?</span></p>
      <p style="margin-top:8px;font-size:12px" class="dim">New here? <span class="switch" id="sw">Create an account</span></p>`;
      $("#fp").onclick=()=>{mode="forgot";err="";draw()};
      $("#go").onclick=async()=>{try{const d=await api.login({username:$("#u").value.toLowerCase(),password:$("#p").value});
        TOKEN=d.token;localStorage.setItem("tnl-token",TOKEN);ME=d.user;GATE=null;GATEWHY="";
        applyAccent(ME.accentHex);startStream();refreshBadges();loadUnreads();render()}catch(e){err=e.message;draw()}};
      $("#sw").onclick=()=>{mode="register";step=1;err="";draw()};
      return}
    if(step===1){body().innerHTML=`
      <h1>Join the workshop.</h1><p>One account across every lab. Your work, your collaborators, and the standing you build — all in one place.</p>
      <label class="mono lbl">DISPLAY NAME</label><input class="in" id="dn" value="${esc(f.displayName)}" maxlength="28">
      <label class="mono lbl">USERNAME</label><input class="in" id="un" value="${esc(f.username)}" maxlength="20" placeholder="lowercase, unique">

      <label class="mono lbl">PASSWORD</label><input class="in" id="pw" type="password" placeholder="6+ characters">
      ${err?`<div class="err">${esc(err)}</div>`:""}
      <button class="btn wide" id="next">Continue</button>
      <p style="margin-top:14px;font-size:12px" class="dim">Already in? <span class="switch" id="sw">Log in</span></p>`;
      $("#next").onclick=()=>{f.displayName=$("#dn").value;f.username=$("#un").value.toLowerCase();f.email=$("#em").value;f.password=$("#pw").value;

        if(!/^\S+@\S+\.\S+$/.test(f.email)){err="Enter a valid email.";return draw()}
        if((f.password||"").length<6){err="Password: 6+ characters.";return draw()}
        err="";step=2;draw()};
      $("#sw").onclick=()=>{mode="login";err="";draw()};
      return}
    body().innerHTML=`
      <h1>What do you make?</h1><p>Pick everything that fits — most people here do more than one thing. This is how collaborators find you.</p>
      <div class="roles">${ROLES.map(r=>`<button class="chip ${f.roles.includes(r)?"on":""}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      ${f.roles.length?`<div class="mono dim" style="margin-top:10px">${f.roles.length} SELECTED</div>`:""}
      ${err?`<div class="err">${esc(err)}</div>`:""}
      <button class="btn wide" id="fin">Enter the Lab ↗</button>
      <button class="link" id="bk">← Back</button>`;
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
      const r=b.dataset.r;
      if(f.roles.includes(r))f.roles=f.roles.filter(x=>x!==r);
      else if(f.roles.length<5)f.roles=[...f.roles,r];
      else{err="Up to 5 roles.";}
      err=f.roles.length?"":err;draw()});
    $("#bk").onclick=()=>{step=1;draw()};
    $("#fin").onclick=async()=>{if(!f.roles.length){err="Pick at least one.";return draw()}
      try{const d=await api.register({...f,roles:f.roles});TOKEN=d.token;localStorage.setItem("tnl-token",TOKEN);ME=d.user;
        if(d.verifyUrl)VERIFYURL=d.verifyUrl;
        GATE=null;GATEWHY="";ONBOARD=1;
        startStream();refreshBadges();render();
        toast(d.mailSent?"Check your email to confirm":"You're in");
      }catch(e){
        /* Once GATE=null and render() ran, #gatebody is gone. The old catch
           called draw() anyway, died on body().innerHTML of null, and buried
           whatever actually threw. If the gate's gone, surface the truth. */
        if(!body()){try{toast("Something broke — reload the page")}catch{}throw e}
        err=e.message;draw()}};
  }
  draw();
}

/* The building. Each tile is a room you can see into: the last piece made
   there, who's been in this week, what's unread. That's what makes it a
   place rather than a nav menu. */
function labsGridHTML(){
  const A=LABACT||{byChannel:{},art:{},people:{},unread:{}};
  const labStats=(l)=>{
    let today=0,week=0,unread=0,last=0,art=null,people=[];
    for(const c of l.channels){
      const b=A.byChannel[c.id];
      if(b){today+=b.today||0;week+=b.week||0;if(b.last_at>last)last=b.last_at}
      unread+=A.unread[c.id]||0;
      const a=A.art[c.id];
      if(a&&(!art||a.at>art.at))art=a;
      for(const p of (A.people[c.id]||[])) if(!people.find(x=>x.username===p.username))people.push(p);
    }
    return {today,week,unread,last,art,people};
  };
  return `<div class="scroll">
    <div class="page-head">
      <div class="mono dim">THE LABS</div>
      <h2 class="page-h">Seven rooms.</h2>
      <p class="page-sub">Enter through what you make — meet everyone else.</p>
    </div>
    <div class="labgrid">${LABS.map(l=>{
      const id=LAB_ID[l.id]||{glyph:"◆",for:""};
      const st=labStats(l);
      const live=st.today>0;
      return `<button class="labtile ${st.unread?"hasnew":""} ${live?"live":""}" data-lab="${l.id}">
        ${st.art?`<img class="labart" src="${esc(st.art.url)}" alt="" loading="lazy">`:""}
        <div class="labshade"></div>
        <div class="labtop">
          <span class="labglyph">${id.glyph}</span>
          ${st.unread?`<span class="labnew mono">${st.unread>9?"9+":st.unread} NEW</span>`
            :live?`<span class="labdot" title="active today"></span>`:""}
        </div>
        <div class="labbody">
          <div class="labname">${esc(l.name)}</div>
          <div class="labfor">${esc(id.for)}</div>
          <div class="labrooms mono">${l.channels.map(c=>"#"+c.label).join("  ")}</div>
        </div>
        <div class="labfoot">
          ${st.people.length?`<div class="labppl">${st.people.slice(0,4).map(p=>
            p.avatarUrl?`<img src="${esc(p.avatarUrl)}" alt="">`
              :`<span>${esc(p.displayName.slice(0,1).toUpperCase())}</span>`).join("")}
            ${st.people.length>4?`<em>+${st.people.length-4}</em>`:""}</div>`:""}
          <span class="mono labmeta">${st.week
            ? st.week+" this week"
            : st.last ? "quiet · last "+timeAgo(st.last)
            : "empty — be first"}</span>
        </div>
      </button>`}).join("")}</div>
    <div class="mono dim labhint">TAP A LAB TO GO IN</div>
  </div>`;
}

/* The post row speaks the same language as the nav and the lab list: geometric
   marks, not drawn icons. ♥ is literally the family ♠ already belongs to in
   CASINO, so like/comment/send now read as house type rather than borrowed UI.

   ♥ carries an emoji presentation on iOS, which would paint it a fixed red and
   ignore `color` — breaking the accent themes. U+FE0E pins it to text, the same
   fix the topbar already uses on ✉︎ and ⚑︎.

   The heart's two states live in CSS (.igi-h::before), so .igact.on still does
   all the work and neither render site had to change. */
const IG_HEART=`<i class="igi igi-h" aria-hidden="true"></i>`;

/* A lab message. Talk is a row: who, what, and the reference — no action
   bar, no collab invite, no inline comments, because none of that belongs in
   a sentence. Work still renders as the full card, and is_work is already the
   field that decides what reaches the Showroom, so one flag now means one
   thing in both places. Consecutive posts from the same person inside five
   minutes drop the header and group, the way every chat client does. */
function msgRowHTML(p,prev){
  const grouped=!!(prev&&!isCard(prev)&&prev.author.username===p.author.username
    &&Math.abs(p.createdAt-prev.createdAt)<300000);
  const imgs=(p.images&&p.images.length)?p.images:(p.imageUrl?[{url:p.imageUrl,thumb:p.thumbUrl}]:[]);
  return `<div class="msg ${grouped?"msg-g":""} ${p.pending?"pending":""}">
    <div class="msg-a">${grouped?"":avHTML(p.author)}</div>
    <div class="msg-c">
      ${grouped?"":`<div class="msg-h"><span class="msg-by" data-u="${esc(p.author.username)}">${esc(p.author.displayName)}</span><span class="msg-t mono">${timeAgo(p.createdAt)}</span></div>`}
      ${p.body?`<div class="msg-b">${rich(p.body)}</div>`:""}
      ${imgs.length?`<div class="msg-m">${imgs.slice(0,4).map(im=>`<img class="msg-i" src="${esc(im.thumb||im.url)}" data-u="${esc(p.author.username)}" alt="" loading="lazy" decoding="async">`).join("")}</div>`:""}
      ${p.videoUrl?`<div class="msg-m"><video class="msg-v" src="${esc(p.videoUrl)}" preload="none" playsinline muted controls></video></div>`:""}
      ${musChipHTML(p)}
      <button class="msg-open" data-openpost="${p.id}">OPEN ↗</button>
    </div>
  </div>`;
}

/* One audio element for the whole app, parked outside #app so a repaint
   can't interrupt playback. Built on first use — no element for people who
   never open the library, and nothing constructed at parse time. */
let AUDIO=null, PLAYERBAR=null;
function audioEl(){
  if(AUDIO)return AUDIO;
  AUDIO=new Audio();
  AUDIO.preload="none";
  const sync=()=>{paintPlayer();if(TAB==="labs"&&CH.library)render()};
  AUDIO.addEventListener("play",sync);
  AUDIO.addEventListener("pause",sync);
  AUDIO.addEventListener("ended",sync);
  return AUDIO;
}
function paintPlayer(){
  if(!PLAYERBAR){
    PLAYERBAR=document.createElement("div");
    PLAYERBAR.className="nowbar";
    document.body.appendChild(PLAYERBAR);
    PLAYERBAR.onclick=e=>{
      if(e.target.closest("[data-nowtoggle]")){const a=audioEl();a.paused?a.play():a.pause();return}
      if(e.target.closest("[data-nowclose]")){if(AUDIO){AUDIO.pause();AUDIO.removeAttribute("src")}NOWPLAYING=null;paintPlayer();
        if(TAB==="labs"&&CH.library)render();}
    };
  }
  /* The file-banner look belongs to MUSIC LAB, where the file is the subject.
     Everywhere else the header credit is the control — Instagram has no
     global player at all. */
  const inLab=TAB==="labs"&&CH&&CH.library;
  if(!NOWPLAYING||!inLab){PLAYERBAR.style.display="none";return}
  PLAYERBAR.style.display="flex";
  PLAYERBAR.innerHTML=`<button class="now-pp" data-nowtoggle>${(!AUDIO||AUDIO.paused)?"▶":"❚❚"}</button>
    <div class="now-meta"><div class="now-t">${esc(NOWPLAYING.title)}</div>
    <div class="mono dim">@${esc(NOWPLAYING.by.username)}</div></div>
    <button class="now-x" data-nowclose>✕</button>`;
}
function playTrack(t,silent){
  const a=audioEl();
  /* Same track already loaded: this is a toggle, not a new play. The promise
     used to be dropped on the floor here, so an iOS refusal looked identical
     to a dead button. */
  if(NOWPLAYING&&NOWPLAYING.id===t.id){
    if(a.paused){const pr=a.play();if(pr&&pr.catch)pr.catch(err=>{if(!silent)toast(err&&err.name==="NotAllowedError"?"Tap once more to allow sound":"Couldn't play that one")})}
    else a.pause();
    return}
  NOWPLAYING=t; a.src=t.url;
  a.play().catch(err=>{if(silent)return;
    /* Name the refusal. iOS rejects play() for exactly three reasons and
       they need three different fixes: NotAllowedError = gesture credit
       (tap again), NotSupportedError = the source itself failed (a server
       or URL problem), AbortError = a new load interrupted this one. A
       blank "couldn't play" hides which one we're debugging. */
    const n=err&&err.name;
    toast(n==="NotAllowedError"?"Tap once more to allow sound"
      :"Couldn't play that one — "+(n||"unknown"));});
  /* A play means someone chose to listen. Scrolling past isn't choosing, so
     autoplay passes silent and the counter stays honest. */
  if(!silent)api.trackPlay(t.id).catch(()=>{});
  paintPlayer();
}

function wireTracks(){
  const q=$("#trkq");
  if(q){let d=null;q.oninput=()=>{TRKQ=q.value;clearTimeout(d);d=setTimeout(loadTracks,300)}}
  const b=$("#trkupbtn");if(b)b.onclick=()=>$("#trkfile")?.click();
  const vb=$("#trkvidbtn");
  if(vb)vb.onclick=async()=>{
    if(TRKEXT)return;
    if(TRKVIDS){TRKVIDS=null;render();return}
    try{TRKVIDS=(await api.myVideos()).videos;render()}
    catch(e){toast(e.message||"Couldn't load your videos")}
  };
  document.querySelectorAll("[data-vidpick]").forEach(el=>el.onclick=async()=>{
    if(TRKEXT)return;
    const videoUrl=el.dataset.vidpick;
    const title=prompt("Track name","");
    if(!title||!title.trim())return;
    TRKEXT=true;render();
    try{
      const ex=await api.extractAudio({videoUrl});
      let durationMs=0;
      try{
        durationMs=await new Promise(res=>{
          const a=new Audio();a.preload="metadata";
          a.onloadedmetadata=()=>res(Math.round((a.duration||0)*1000));
          a.onerror=()=>res(0);a.src=ex.url;
        });
      }catch(e){}
      await api.addTrack({title:title.trim(),url:ex.url,durationMs,bytes:ex.bytes||0});
      TRKEXT=false;TRKVIDS=null;await loadTracks();toast("Pulled it.");
    }catch(e){TRKEXT=false;render();toast(e.message||"Extraction failed")}
  });
  const f=$("#trkfile");
  if(f)f.onchange=async()=>{
    const file=f.files&&f.files[0];f.value="";
    if(!file)return;
    const isAud=/^audio\//.test(file.type)||/\.(mp3|m4a|wav|aac|aiff|aif|flac|ogg)$/i.test(file.name);
    if(!isAud)return toast("Audio files only");
    if(file.size>100*1024*1024)return toast("Over 100MB — trim it down");
    /* No prompt() on the way in — the file lands, then the edit sheet opens
       pre-filled so it gets a real name and a cover in one pass. */
    const title=file.name.replace(/\.[a-z0-9]+$/i,"")||"Untitled";
    TRKUP=true;render();
    try{
      const up=await uploadStream(file);
      let durationMs=0;
      try{
        durationMs=await new Promise(res=>{
          const a=new Audio();a.preload="metadata";
          a.onloadedmetadata=()=>res(Math.round((a.duration||0)*1000));
          a.onerror=()=>res(0);a.src=up.url;
        });
      }catch(e){}
      const made=await api.addTrack({title:title.trim(),url:up.url,durationMs,bytes:file.size});
      TRKUP=false;await loadTracks();
      if(made&&made.track)TRKEDIT={id:made.track.id,title:made.track.title,artworkUrl:made.track.artworkUrl||"",busy:false,fresh:true};
      render();
    }catch(e){TRKUP=false;render();toast(e.message||"Upload failed")}
  };
  document.querySelectorAll("[data-trkplay]").forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();
    const t=(TRACKS||[]).find(x=>String(x.id)===el.dataset.trkplay);
    if(t){MUSAUTOID=null;playTrack(t)}   // lab playback belongs to no post
  });
  document.querySelectorAll("[data-trkedit]").forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();
    const t=(TRACKS||[]).find(x=>String(x.id)===el.dataset.trkedit);
    if(t)TRKEDIT={id:t.id,title:t.title,artworkUrl:t.artworkUrl||"",busy:false,fresh:false};
    render();
  });
  document.querySelectorAll("[data-trkdel]").forEach(el=>el.onclick=async ev=>{
    ev.stopPropagation();
    if(!confirm("Delete this track?"))return;
    try{await api.delTrack(el.dataset.trkdel);
      if(NOWPLAYING&&String(NOWPLAYING.id)===el.dataset.trkdel){if(AUDIO)AUDIO.pause();NOWPLAYING=null;paintPlayer()}
      await loadTracks()}catch(e){toast(e.message)}
  });
}

function nextRate(){
  if(!ME)return null;
  const lad=MKTMETA.feeLadder||[];
  const lvl=levelFor(ME.rep).id;
  const nxt=lad.find(x=>x.level===lvl+1);
  if(!nxt)return null;
  return {need:nxt.at-ME.rep,fee:nxt.fee,name:nxt.name};
}
function rateHTML(){
  if(!ME)return "";
  const fee=MKTMETA.feePct??10;
  const n=nextRate();
  return `<div class="ratebar">
    <div class="ratenow"><b>${fee}%</b><span class="mono dim">YOUR RATE</span></div>
    <div class="rateinfo">
      <div class="mono dim">DEPOP TAKES 10% FOREVER. HERE IT DROPS AS PEOPLE VOUCH FOR YOU.</div>
      ${n?`<div class="ratenext">${n.need} more rep → <b>${n.fee}%</b> at ${esc(n.name)}</div>`
        :`<div class="ratenext">You're at the best rate in the network.</div>`}
    </div>
    <button class="ratelad mono" id="rateladder">SEE ALL →</button>
  </div>`}

  const fee=x=>lad.find(r=>r.level===x)?.fee??10;
  const pct=nx?Math.min(100,Math.round((rep-me.at)/(nx.at-me.at)*100)):100;

    1:["Post work and get seen","Back others — every like you give is someone's rep","Sell at "+fee(1)+"% — keep $"+(100-fee(1))+" of every $100"],

    3:["The network reads you as proven — collabs come to you","Fee drops to "+fee(3)+"% — keep $"+(100-fee(3))],
    4:["Core of the network — your word carries","Fee drops to "+fee(4)+"% — keep $"+(100-fee(4))],
    5:["Best rate in the network — "+fee(5)+"%, keep $"+(100-fee(5)),"You shape where this goes"]};

        <div class="mono dim">ON EVERY $100 YOU SELL, YOU KEEP</div>
        <div class="cbars">${LEVELS.map(l=>`<div class="cbar ${me.id>=l.id?"on":""}">
          <b>$${100-fee(l.id)}</b><i style="height:${(100-fee(l.id))*0.9}px"></i><b>L${l.id}</b></div>`).join("")}</div>
        <div style="margin-top:12px;font-size:13px">You keep <b style="color:var(--green)">$${100-fee(me.id)}</b> today${nx?` — reach <b>${esc(nx.name)}</b> and keep <b>$${100-fee(nx.id)}</b>`:` — the best rate there is`}.</div>
      </div>
      <div class="cprog">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span><span class="pbadge">L${me.id}</span> <b style="margin-left:6px">${esc(me.name)}</b></span>
          <span class="mono dim">${rep} REP${nx?` · ${nx.at-rep} TO ${esc(nx.name.toUpperCase())}`:" · TOP"}</span>
        </div>
        <div class="ptrack" style="margin-top:8px"><div class="pfill" style="width:${pct}%"></div></div>
      </div>
      ${LEVELS.map(l=>`<div class="crung ${me.id>=l.id?"done":""} ${me.id===l.id?"here":""}">
        <button class="crung-t" data-crung="${l.id}">
          <span class="crung-n">${me.id>=l.id?"✓":l.id}</span>
          <span style="flex:1"><b>${esc(l.name)}</b>${me.id===l.id?` <span class="mono" style="color:var(--green);font-size:9px;letter-spacing:.2em">YOU'RE HERE</span>`:""}<br><span class="mono dim" style="font-size:10px">${l.at} REP · KEEP ${100-fee(l.id)}%</span></span>

      </div>
    </div>
    <div class="climb-cta"><button class="btn green" id="climbgo">Post your work — start climbing</button></div>
  </div>`}

/* Renders one piece of work on a profile. Takes the account's KIND so the
   collab credit reads in their language — "Designed with" vs "Made with". */
function workCardHTML(p, collab, K) {
  K = K || KIND;
  const accepted = p.collaborators.filter(c => c.status === "accepted");
  const kind = p.beat ? "BEAT" : p.videoUrl ? "VIDEO" : p.imageUrl ? "IMAGE" : "POST";
  /* A tile is an index, not the work. Image plus an indicator that there is more
     inside — author, sound, actions, caption and comments all belong to the
     expanded card the tile opens (021's overlay). Keeps the profile a scannable
     grid instead of a second feed. */
  const many = p.images && p.images.length > 1;
  return `<div class="work" data-openpost="${p.id}">
    ${p.beat ? `<div class="work-beat"><button class="circle" style="width:28px;height:28px;font-size:10px" data-beatplay='${esc(JSON.stringify(p.beat))}'>▶</button><span class="nm">${esc(p.beat.name || "untitled loop")}</span><span class="mono dim">${p.beat.bpm}BPM</span></div>`
      : (many || p.imageUrl) ? `<img class="work-img" src="${esc(many ? (p.images[0].thumb || p.images[0].url) : (p.thumbUrl || p.imageUrl))}" alt="work" loading="lazy" decoding="async">`
      /* NOT a <video>. With preload="none" and no poster the element renders
         empty AND, on iOS, swallows the tap instead of letting it bubble to
         .work[data-openpost] — so the tile looked blank and could not be
         opened at all. A tile only ever needs to look like something and be
         tappable; the real player lives in the expanded post. Replace with a
         plain div until videos get real poster frames generated at upload. */
      : p.videoUrl ? `<div class="work-vid" aria-label="Video"></div>`
      : `<div class="work-body">${esc(p.body || "—")}</div>`}
    ${many ? `<span class="work-ind" aria-label="${p.images.length} photos">⧉</span>`
      : p.videoUrl ? `<span class="work-ind" aria-label="Video">▶</span>` : ""}
  </div>`;
}

/* ---- wiring ---- */
function wire(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=async()=>{
    if(PCOMPOSE&&b.dataset.tab!=="post"&&!await pcLeave())return;
    if(b.dataset.tab==="post"){
      if(PCOMPOSE)return;   // already here — tapping ＋ again must not wipe the draft
      /* ＋ means POST, on every tab — the Market included. It used to flip
         to the sell form there, which read as the app changing its mind
         about what the button is. Selling keeps its own ＋ Sell button in
         the Market header; the nav ＋ does one thing everywhere. */
      if(guest())return needAccount("Join to post — it lands on your profile and the Showroom.");
      PCOMPOSE={body:"",imgs:[],busy:false};pushView("compose");render();return;
    }
    if(b.dataset.tab==="profile"){
      if(guest())return needAccount("Join to build your profile — your work, your standing, your shop.");
      openProfile(myName());return;
    }
    TAB=b.dataset.tab;PROFILE=null;if(window.TNLStudio)TNLStudio.unmount();if(TAB==="market"){MKTVIEW="browse";loadMarket()}if(TAB==="labs")loadLabs();render()});
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{TAB=b.dataset.goto;PROFILE=null;render()});
  if(ONBOARD)wireOnboard();
  const srp=$("#sr-post");if(srp)srp.onclick=()=>{
    /* Used to route into "the room your trade lives in" — but a lab send
       is chat now, so that button led away from the one place a post can
       be made. Same destination as the nav ＋: the post composer. */
    if(guest())return needAccount("Join to post — it lands on your profile and the Showroom.");
    PCOMPOSE={body:"",imgs:[],busy:false};pushView("compose");render();
  };
  /* ---- the archive + moodboards ---- */
  const pgo=$("#pastego"), pin_=$("#pastein");
  const doPaste=async()=>{
    const url=(pin_?.value||"").trim();
    if(!url)return;
    PASTING=true;PASTEERR=null;PASTED=null;render();
    try{
      PASTED=await api.unfurl(url);
      /* Keep the link. The image is theirs and lives at their URL — we're
         a moodboard, not a mirror. */
      PASTED.url=url;
    }catch(e){
      let detail="";
      try{const j=JSON.parse(e.detail||"{}");detail=j.detail||""}catch(x){}
      PASTEERR={error:e.message, detail:/instagram/i.test(e.message)
        ? "Their image URLs are signed and expire, and they serve crawlers a login wall. Screenshot it and upload instead — or use the are.na/Pinterest source if there is one."
        : detail};
    }
    PASTING=false;render();
  };
  if(pgo)pgo.onclick=doPaste;
  if(pin_)pin_.onkeydown=e=>{if(e.key==="Enter")doPaste()};
  const px=$("#pastex");if(px)px.onclick=()=>{PASTED=null;PASTEERR=null;render()};
  const psave=$("#pastesave");if(psave)psave.onclick=async()=>{
    if(!BOARDS)await loadBoards();
    if(!BOARDS.length){BOARDSOPEN=true;render();return toast("Make a moodboard first")}
    openPicker({eyebrow:"PULL INTO",title:"Which moodboard?",
      note:"The link and the source are kept. We never rehost the file.",
      items:BOARDS.map(b=>({label:b.name,sub:b.count+(b.count===1?" image":" images"),icon:"◫",bid:b.id})),
      onPick:async(it)=>{
        try{
          await api.pin(it.bid,{srcUrl:PASTED.url,imgUrl:PASTED.image,note:PASTED.title||""});
          PASTED=null;if(pin_)pin_.value="";BOARDS=null;
          toast("Pulled into "+it.label);render();
        }catch(e){toast(e.message)}}});
  };

  const arq=$("#archq");
  if(arq)arq.oninput=()=>{
    /* Debounced by hand — the app has no debounce helper, and inventing one
       that doesn't exist is exactly what blanked the screen last week. */
    clearTimeout(ARCHT);
    ARCHT=setTimeout(()=>{ARCHFILT.q=arq.value.trim()||undefined;loadArchive()},260);
  };
  document.querySelectorAll("[data-asrc]").forEach(b=>b.onclick=()=>{
    ARCHSRC=b.dataset.asrc;render();
    /* Pinterest's widget script only runs once per load. Re-inject it when
       the tab opens or the board renders as a dead link. */
    if(ARCHSRC==="pin"){
      const old=document.getElementById("pinjs"); if(old)old.remove();
      const sc=document.createElement("script");
      sc.id="pinjs"; sc.async=true; sc.defer=true; sc.src="https://assets.pinterest.com/js/pinit.js";
      document.body.appendChild(sc);
    }
  });
  document.querySelectorAll("[data-asort]").forEach(b=>b.onclick=()=>{ARCHFILT.sort=b.dataset.asort||undefined;loadArchive()});
  document.querySelectorAll("[data-ach]").forEach(b=>b.onclick=()=>{
    ARCHFILT.channel=ARCHFILT.channel===b.dataset.ach?undefined:b.dataset.ach;loadArchive()});
  const ac=$("#archclear");if(ac)ac.onclick=()=>{ARCHFILT={};loadArchive()};
  document.querySelectorAll("[data-aopen]").forEach(b=>b.onclick=(e)=>{
    if(e.target.closest("[data-asave]"))return;   // the ＋ is its own button
    const x=(ARCHIVE?.images||[]).find(i=>String(i.id)===b.dataset.aopen);
    if(x)LIGHTBOX=x.full||x.url; render();
  });
  document.querySelectorAll("[data-asave]").forEach(b=>b.onclick=async(e)=>{
    e.stopPropagation();
    if(guest())return needAccount("Join to pull reference into a moodboard.");
    const id=+b.dataset.asave;

/* Autoplay, the way a feed should do it: muted when it scrolls into view,
   paused the moment it leaves. Muted is not a style choice — browsers block
   autoplay WITH sound, so an unmuted autoplay simply never starts.

   One observer, rebuilt each render (the DOM is replaced wholesale), and
   disconnected first so observers don't pile up on every repaint. */
let VOBS=null;
/* Carousels. CSS scroll-snap does the swiping — no library, no drag maths,
   and it inherits momentum scrolling for free. This just keeps the dots and
   the counter honest about where you are. */
function wireInstall(){
  const x=$("[data-installx]");if(x)x.onclick=dismissInstall;
  const go=$("[data-installgo]");if(go)go.onclick=doInstall;
}
function wireCaros(){
  document.querySelectorAll("[data-caro]").forEach(c=>{
    const track=c.querySelector(".caro-t");
    const dots=[...c.querySelectorAll(".caro-d span")];
    const num=c.querySelector(".caro-n");
    if(!track||c.dataset.caroBound)return;
    c.dataset.caroBound="1";
    let t=null;
    track.onscroll=()=>{
      clearTimeout(t);
      t=setTimeout(()=>{
        const i=Math.round(track.scrollLeft/track.clientWidth);
        dots.forEach((d,j)=>d.classList.toggle("on",j===i));
        if(num)num.textContent=(i+1)+"/"+dots.length;
      },60);
    };
  });
}

function wireVideos(){
  if(VOBS){VOBS.disconnect();VOBS=null}
  const vids=[...document.querySelectorAll("video[data-auto]")];
  if(!vids.length)return;

  VOBS=new IntersectionObserver((entries)=>{
    for(const e of entries){
      const v=e.target;
      if(e.isIntersecting&&e.intersectionRatio>0.55){
        const p=v.play();
        if(p&&p.catch)p.catch((err)=>{
          /* iOS refuses autoplay outright in Low Power Mode — no code can
             override that. Don't leave a dead black box: show a play button
             and let them start it by hand. */
          if(err&&err.name==="NotAllowedError"){
            const w=v.parentElement;
            if(w&&!w.querySelector(".vplay")){
              const b=document.createElement("button");
              b.className="vplay"; b.textContent="▶"; b.setAttribute("aria-label","Play");
              b.onclick=(ev)=>{ev.stopPropagation();v.play().then(()=>b.remove()).catch(()=>{})};
              w.appendChild(b);
            }
          }
        });
      }else{
        try{v.pause()}catch(err){}
      }
    }
  },{threshold:[0,0.55,1]});

  for(const v of vids){
    v.muted=true;                 // required, or autoplay is refused outright
    /* Without this iOS shows a black rectangle until you press play —
       #t=0.1 makes it decode one frame so there's something to look at. */
    if(v.src&&!/#t=/.test(v.src))v.src=v.src+"#t=0.1";
    VOBS.observe(v);
    v.onclick=()=>{
      v.muted=!v.muted;
      const btn=v.parentElement&&v.parentElement.querySelector("[data-vmute]");
      if(btn)btn.textContent=v.muted?"🔇":"🔊";
      if(v.paused)v.play().catch(()=>{});
      if(!v.muted){ // only one thing makes noise at a time
        for(const o of vids) if(o!==v){o.muted=true;
          const b=o.parentElement&&o.parentElement.querySelector("[data-vmute]");
          if(b)b.textContent="🔇"}
      }
    };
  }
  document.querySelectorAll("[data-vmute]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const v=b.parentElement.querySelector("video");
    if(v)v.onclick();
  });
}

/* The sound credit on a card — tap plays it through the global player and
   counts a play for the track's owner, exactly like the library rows. */
function musChipHTML(p){
  if(!p.audioTrack)return "";
  const on=NOWPLAYING&&NOWPLAYING.id===p.audioTrack.id&&AUDIO&&!AUDIO.paused;
  return `<button class="muschip" data-mustrack="${p.id}">${on?"❚❚":"♫"} <span class="muschip-t">${esc(p.audioTrack.title)}</span><span class="mono dim">· @${esc(p.audioTrack.by.username)}</span></button>`;

/* iOS will not start audio without a gesture, so autoplay stays off until the
   first deliberate chip tap unlocks it for the session. MUSMUTE is set when
   someone pauses on purpose — without it, the next scroll would restart the
   track they just silenced. MUSAUTOID marks a track that autoplay started, so
   scrolling away only stops music the reader didn't ask for. */
let MUSOK=false, MUSMUTE=null, MUSAUTOID=null, MOBS=null;
/* Post ids whose card has actually ENTERED the centre band. "Stops the
   instant it leaves" requires having been in — a Set, not element state,
   because render() rebuilds the DOM and the observer with it. */
let MUSBAND=new Set();
let MUSPRIMED=false;
/* A zero-length WAV. Playing it inside a real tap is what unlocks the audio
   element on iOS; nothing is audible. */
const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
/* One audio unlock for the whole app. iOS will not let script start sound
   until the element has played inside a real gesture; the first touch
   anywhere plays a zero-length WAV, and that unlock holds for the session.

   The old cleanup used setTimeout(...,0), which fired BEFORE the silent
   play() resolved and aborted it — and an aborted play does not unlock the
   element. MUSOK then reported "ready" while the element was still locked,
   so the next programmatic play() was refused. Whether that race was won
   depended on how fast the data URI decoded, which is exactly why it
   behaved differently in Safari, in the home-screen app, and on different
   days. Cleanup now waits on the promise, and the src is never removed:
   dropping the source can reset activation on WebKit.

   skipWire is for the intro door, which unlocks during its own tap but
   must not attach the feed observer while the overlay is still up. */
function primeAudio(skipWire){
  if(MUSPRIMED)return;MUSPRIMED=true;
  try{
    const a=audioEl();
    if(!a.getAttribute("src")){
      a.src=SILENT;
      const pr=a.play();
      const tidy=()=>{try{if((a.getAttribute("src")||"").startsWith("data:"))a.pause()}catch(e){}};
      if(pr&&pr.then)pr.then(tidy,()=>{}); else tidy();
    }
    MUSOK=true;
  }catch(e){}
  if(!skipWire)wireMusAuto();
}
let MUSDELEG=false;
(function wireMusChips(){
  if(MUSDELEG)return;MUSDELEG=true;
  /* One capture-phase delegate for every surface — stops the tap before a
     work card's data-openpost swallows it. */
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-mustrack]");if(!b)return;
    e.stopPropagation();e.preventDefault();
    const id=b.dataset.mustrack;
    const p=(POSTS||[]).find(x=>String(x.id)===id)
      ||(SRPOSTS||[]).find(x=>String(x.id)===id)
      ||(SEARCHRES&&SEARCHRES.posts||[]).find(x=>String(x.id)===id)
      ||(PROFILE&&[...PROFILE.posts,...PROFILE.collabs]||[]).find(x=>String(x.id)===id);
    if(p&&p.audioTrack){
      const a=audioEl();
      const stopping=NOWPLAYING&&NOWPLAYING.id===p.audioTrack.id&&!a.paused;
      MUSOK=true;                    // the gesture iOS was waiting for
      MUSMUTE=stopping?p.id:null;    // that POST stays silent; others still autoplay
      MUSAUTOID=p.id;                // this post owns the sound now — and it
                                     // still stops the instant the post leaves
      playTrack(p.audioTrack);
      /* Repaint so the glyph flips — a tap must always visibly do something,
         otherwise working and broken look the same. render() rewires, which
         covers wireMusAuto(). */
      render();
    }
  },true);

  /* iOS needs one gesture before it will let script start audio — but it does
     not need that gesture to be on a chip. Prime on the first touch anywhere,
     so scrolling into a post just works instead of depending on someone
     discovering the chip first. pointerdown fires before click, so the unlock
     is in place before any handler asks for sound; click stays as the
     fallback where pointer events are absent. */
  document.addEventListener("pointerdown",()=>primeAudio(),true);
  document.addEventListener("click",()=>primeAudio(),true);
})();

/* Tile → full post. Reuses postHTML wholesale rather than a second renderer:
   carousel, video, sound credit, actions and comments are all already built
   there and already wired document-wide by wireFeed(), so this stays one
   source of truth for what a post looks like. */
function postOpenHTML(){
  const p=(PROFILE&&[...PROFILE.posts,...PROFILE.collabs].find(x=>Number(x.id)===Number(POSTOPEN.id)))
    ||(POSTS||[]).find(x=>Number(x.id)===Number(POSTOPEN.id))
    ||POSTOPEN;
  return `<div class="po-ov" id="poov">
    <header class="po-top">
      <button class="po-x" id="poclose" aria-label="Close">←</button>
      <div class="po-ttl">Post</div><span class="po-sp"></span>
    </header>
    <div class="po-body">${postHTML(p)}</div>
  </div>`;
}
/* Any post currently in memory, wherever it came from. */
function postById(id){
  return (POSTS||[]).find(x=>String(x.id)===String(id))
    ||(SRPOSTS||[]).find(x=>String(x.id)===String(id))
    ||(SEARCHRES&&(SEARCHRES.posts||[]).find(x=>String(x.id)===String(id)))
    ||(PROFILE&&[...PROFILE.posts,...PROFILE.collabs].find(x=>String(x.id)===String(id)))
    ||null;
}

/* Music follows the post you're actually looking at. The rootMargin band means
   a chip only counts as in view once it reaches the middle fifth of the screen,
   so two half-visible posts can't fight over the speaker. Videos autoplay muted,
   so nothing here competes with them. */
function wireMusAuto(){
  if(MOBS){MOBS.disconnect();MOBS=null}
  if(!MUSOK)return;
  const chips=[...document.querySelectorAll("[data-mustrack]")];
  /* Nothing carries over between surfaces: if the post that owns the sound is
     no longer on screen — left the profile, left the Showroom, closed the
     overlay — the sound stops with it. Lab playback (MUSAUTOID null) is
     exempt; the lab has its own player. */
  if(MUSAUTOID!=null&&NOWPLAYING){
    const still=chips.some(c=>String(c.dataset.mustrack)===String(MUSAUTOID));
    if(!still){const a=audioEl();if(!a.paused)a.pause();MUSAUTOID=null;paintPlayer();}
  }
  if(!chips.length)return;
  /* Watch the CARD, not the chip. The chip is one line of text and 025 moved it
     into the header below the photo, so it crossed the centre band in a fraction
     of the time a tall image takes — music fired and un-fired, or never fired at
     all. The card overlapping the middle fifth is what "the post you are looking
     at" actually means. */
  const cards=[];
  for(const c of chips){
    const card=c.closest(".post,.sr-card")||c;
    card.dataset.muspost=c.dataset.mustrack;
    cards.push(card);
  }
  MOBS=new IntersectionObserver((entries)=>{
    for(const e of entries){
      const p=postById(e.target.dataset.muspost);
      if(!p||!p.audioTrack)continue;
      const a=audioEl();
      /* The rule: music starts the moment a post is centred, stops the instant
         it leaves, only one ever plays, and nothing carries over between posts.
         MUSAUTOID is the POST that owns the sound — keyed on the track, two
         posts sharing a song fought each other; keyed on the post, a repeat of
         the same song restarts from the top like a fresh post should. */
      if(e.isIntersecting){
        MUSBAND.add(String(p.id));
        /* You silenced THIS post — leave it silent, but any other post clears it. */
        if(MUSMUTE!=null&&String(MUSMUTE)===String(p.id))continue;
        MUSMUTE=null;
        if(MUSAUTOID===p.id&&NOWPLAYING&&NOWPLAYING.id===p.audioTrack.id&&!a.paused)continue;
        MUSAUTOID=p.id;
        if(NOWPLAYING&&NOWPLAYING.id===p.audioTrack.id){
          a.currentTime=0;
          const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});
          paintPlayer();
        }else playTrack(p.audioTrack,true);
      }else if(MUSAUTOID===p.id&&NOWPLAYING&&NOWPLAYING.id===p.audioTrack.id){
        /* "Stops the instant it LEAVES" — leaving requires having been in.
           Every render() rebuilds this observer, and its first pass reports
           current state for every card. A post tapped while sitting OUTSIDE
           the band (the guest landing pushes the first card below it) used
           to be "not intersecting" on that first pass and got paused mid-
           load — killing the tap's own play() with an AbortError. Now an
           exit only counts if this post actually entered the band first. */
        if(!MUSBAND.has(String(p.id)))continue;
        MUSBAND.delete(String(p.id));
        if(!a.paused)a.pause();
        paintPlayer();
      }
    }
  },{rootMargin:"-40% 0px -40% 0px",threshold:0});
  cards.forEach(c=>MOBS.observe(c));
}

function wirePostOpen(){
  const ov=$("#poov");if(!ov)return;
  const x=$("#poclose");if(x)x.onclick=()=>{POSTOPEN=null;OPENCOMMENTS=null;render()};
}

/* Picker rows, extracted so the search box can repaint just the list without
   a full render() stealing the keyboard mid-word. */
function pcmusRowsHTML(list,searching){
  if(!list)return `<div class="empty">Loading…</div>`;
  if(!list.length)return searching
    ?`<div class="empty">No tracks match that.</div>`
    :`<div class="empty">No tracks in the library yet.<br>Upload one in MUSIC LAB → #tracks.</div>`;
  return list.map(t=>`<div class="pcmus-row" data-pcmuspick="${t.id}"><div class="trk-art">${t.artworkUrl?`<img src="${esc(t.artworkUrl)}" alt="">`:"♫"}</div><div class="pcmus-meta"><div class="pcmus-t">${esc(t.title)}</div><div class="mono dim">@${esc(t.by.username)}${t.durationMs?" · "+mmss(t.durationMs):""}</div></div></div>`).join("");
}

/* Name + cover, owner only. The server already scopes PATCH /api/tracks/:id to
   the owner, so this adds presentation, not a new trust surface. */
function trkEditHTML(){
  const e=TRKEDIT;
  return `<div class="pcmp-ov" id="trkeov"><div class="pcmp-sheet" role="dialog" aria-label="Edit track">
    <header class="pcmp-top">
      <button class="pcmp-x" id="trkecancel">${e.fresh?"Later":"Cancel"}</button>
      <div class="pcmp-ttl">${e.fresh?"Name your track":"Edit track"}</div>
      <button class="pcmp-share" id="trkesave" ${e.title.trim()&&!e.busy?"":"disabled"}>${e.busy?"Saving…":"Save"}</button>
    </header>
    <div class="pcmp-body">
      <div class="trke-row">
        <label class="trke-art">${e.artworkUrl?`<img src="${esc(e.artworkUrl)}" alt="">`:`<span>♫<br><small>Add cover</small></span>`}
          <input type="file" id="trkeart" accept="image/*" hidden></label>
        <div class="trke-fields">
          <input class="ui-in" id="trketitle" placeholder="Track name" value="${esc(e.title)}" maxlength="120">
          ${e.artworkUrl?`<button class="trke-rm" id="trkeartrm">Remove cover</button>`:""}
        </div>
      </div>
      <div class="pcmp-note">The name and cover are yours to change any time — they travel with the track everywhere it gets used.</div>
    </div>
  </div></div>`;
}
function wireTrkEdit(){
  const ov=$("#trkeov");if(!ov)return;
  const ti=$("#trketitle");if(ti)ti.oninput=()=>{
    TRKEDIT.title=ti.value;
    const s=$("#trkesave");if(s)s.disabled=!TRKEDIT.title.trim()||TRKEDIT.busy;
  };
  const af=$("#trkeart");if(af)af.onchange=async()=>{
    const file=af.files&&af.files[0];af.value="";
    if(!file)return;
    if(!/^image\//.test(file.type))return toast("Images only");
    try{const data=await compressImage(file,700,.85);const up=await api.upload(data);
      TRKEDIT.artworkUrl=up.url||"";render();}
    catch(err){toast(err.message||"Couldn't use that image")}
  };
  const rm=$("#trkeartrm");if(rm)rm.onclick=()=>{TRKEDIT.artworkUrl="";render()};
  const cc=$("#trkecancel");if(cc)cc.onclick=()=>{TRKEDIT=null;render()};
  ov.onclick=ev=>{if(ev.target===ov&&!TRKEDIT.busy){TRKEDIT=null;render()}};
  const sv=$("#trkesave");if(sv)sv.onclick=async()=>{
    if(TRKEDIT.busy||!TRKEDIT.title.trim())return;
    TRKEDIT.busy=true;render();
    try{
      await api.updateTrack(TRKEDIT.id,{title:TRKEDIT.title.trim(),artworkUrl:TRKEDIT.artworkUrl});
      TRKEDIT=null;await loadTracks();toast("Saved.");render();
    }catch(err){TRKEDIT.busy=false;render();toast(err.message||"Save failed")}
  };
}

function wirePCompose(){
  const ov=$("#pcov");if(!ov)return;
  const fi=$("#pcfile");if(fi)fi.onchange=async()=>{
    for(const file of fi.files){
      if(PCOMPOSE.imgs.length>=10)break;
      try{const p=await prepImage(file,true);
        const up=await api.upload(p.full);const th=await api.upload(p.thumb);
        PCOMPOSE.imgs.push({url:up.url,thumb:th.url,w:p.w,h:p.h});}catch(e){toast(e.message)}
    }
    render();
  };
  document.querySelectorAll("[data-pcrm]").forEach(b=>b.onclick=()=>{PCOMPOSE.imgs.splice(+b.dataset.pcrm,1);render()});
  const ta=$("#pcbody");if(ta)ta.oninput=()=>{
    PCOMPOSE.body=ta.value;
    /* toggle Share live — re-rendering here would steal focus mid-sentence */
    const g=$("#pcgo");if(g)g.disabled=!(PCOMPOSE.body.trim()||PCOMPOSE.imgs.length)||PCOMPOSE.busy;
  };
  /* No scrim dismiss. As an overlay this was a tap outside the card; as a
     full-height page the same handler is a tap on the background, and it would
     silently bin a written draft. Cancel is the way out. */
  const cc=$("#pccancel");if(cc)cc.onclick=async()=>{if(await pcLeave())render()};
  const ma=document.querySelector("[data-pcmusadd]");if(ma)ma.onclick=async()=>{
    PCOMPOSE.pick=!PCOMPOSE.pick;render();
    if(PCOMPOSE.pick&&!PCOMPOSE.list){try{PCOMPOSE.list=(await api.tracks("")).tracks}catch(e){PCOMPOSE.list=[]}render()}
  };
  document.querySelectorAll("[data-pcmuspick]").forEach(el=>el.onclick=()=>{
    PCOMPOSE.track=(PCOMPOSE.list||[]).find(t=>String(t.id)===el.dataset.pcmuspick)||null;
    PCOMPOSE.pick=false;render();
  });
  const mq=$("#pcmusq");if(mq){let dq=null;mq.oninput=()=>{
    PCOMPOSE.q=mq.value;clearTimeout(dq);
    dq=setTimeout(async()=>{
      try{PCOMPOSE.list=(await api.tracks(PCOMPOSE.q)).tracks}catch(e){PCOMPOSE.list=[]}
      /* repaint the rows only — a full render() would close the keyboard */
      const box=document.querySelector(".pcmus-list");
      if(box){box.innerHTML=pcmusRowsHTML(PCOMPOSE.list,!!PCOMPOSE.q.trim());
        box.querySelectorAll("[data-pcmuspick]").forEach(el=>el.onclick=()=>{
          PCOMPOSE.track=(PCOMPOSE.list||[]).find(t=>String(t.id)===el.dataset.pcmuspick)||null;
          PCOMPOSE.pick=false;render();
        });}
    },300);
  }}
  const mr=document.querySelector("[data-pcmusrm]");if(mr)mr.onclick=()=>{PCOMPOSE.track=null;render()};
  const mp=document.querySelector("[data-pcmusplay]");if(mp)mp.onclick=()=>{if(PCOMPOSE.track)playTrack(PCOMPOSE.track)};
  const go=$("#pcgo");if(go)go.onclick=async()=>{
    if(PCOMPOSE.busy)return;
    if(!PCOMPOSE.body.trim()&&!PCOMPOSE.imgs.length)return toast("Add a photo or say something");
    PCOMPOSE.busy=true;render();
    try{
      await api.post({channel:"profile",body:PCOMPOSE.body.trim(),images:PCOMPOSE.imgs,isWork:true,audioTrackId:PCOMPOSE.track?PCOMPOSE.track.id:undefined});
      PCOMPOSE=null;toast("Posted to your profile");
      openProfile(myName());
    }catch(e){PCOMPOSE.busy=false;toast(e.message);render()}
  };
}
function wireFeed(){
  wireVideos();   // autoplay in view — must run after every feed repaint
  /* The sound observer travels with the video one. Showroom and the room feed
     paint straight into #sr-grid / #feed and call wireFeed() WITHOUT going
     through render(), so wireMusAuto() in the wire() chain never saw those
     cards and autoplay only ever worked in surfaces render() repainted. */
  wireMusAuto();
  wireCaros();
  wireInstall();
  document.querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{
    if(guest())return needAccount("Back someone's work. Likes are how people earn standing here — it's the whole point.");
    const id=b.dataset.like;
    const p=POSTS.find(x=>String(x.id)===id)||SRPOSTS.find(x=>String(x.id)===id)||(SEARCHRES&&SEARCHRES.posts.find(x=>String(x.id)===id))
      ||(PROFILE&&[...PROFILE.posts,...PROFILE.collabs].find(x=>String(x.id)===id));
    // flip it now, reconcile after. Repaint ONLY this button — a full
    // re-render here throws away your scroll position.
    const was=p?p.likedByMe:b.classList.contains("on");
    const now=!was;
    if(p){p.likedByMe=now;p.likeCount=Math.max(0,p.likeCount+(now?1:-1))}
    b.classList.toggle("on",now);
    const n=b.querySelector(".igact-n");
    if(n){n.textContent=p?(p.likeCount||""):"";}          // new IG icon button
    else{b.textContent=(now?"♥":"♡")+" "+(p?(p.likeCount||""):"");}  // legacy glyph cards
    try{
      const liked=await api.like(id);
      if(p&&liked!==now){ // server disagreed — trust it
        p.likedByMe=liked;p.likeCount=Math.max(0,p.likeCount+(liked?1:-1));
        b.classList.toggle("on",liked);
        /* textContent= used to wipe the icon AND the count span, leaving a bare
           text stub until the next full render. Repaint the count only. */
        const n2=b.querySelector(".igact-n");if(n2)n2.textContent=p.likeCount||"";
      }
    }catch(e){
      if(p){p.likedByMe=was;p.likeCount=Math.max(0,p.likeCount+(was?1:-1));
        b.classList.toggle("on",was);
        const n3=b.querySelector(".igact-n");if(n3)n3.textContent=p.likeCount||"";}
      toast(e.message);
    }});
  document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>{
    if(guest())return needAccount("Join to carry work across the labs.");
    const id=b.dataset.share;
    const post=POSTS.find(x=>String(x.id)===id)
      ||SRPOSTS.find(x=>String(x.id)===id)
      ||(SEARCHRES&&SEARCHRES.posts.find(x=>String(x.id)===id))
      ||(PROFILE&&[...PROFILE.posts,...PROFILE.collabs].find(x=>String(x.id)===id));
    /* A share card in a lab carries the ORIGINAL's public page — the copy
       has isWork=0 by design, but the post it points at is public. */
    const pubId=post&&post.sharedFrom?post.sharedFrom:id;
    const link=location.origin+"/p/"+pubId;
    const shareable=!!(post&&(post.isWork||post.sharedFrom));

    /* Published work leads with "into a lab" — that's the Instagram move
       and the one that actually feeds the network. Chat leads with DM,
       because a message isn't something you broadcast. */
    /* Published work leads with "into a lab" — the move that feeds the
       network and earns the author rep. Right after it comes OFF the app:
       on a phone navigator.share opens the OS sheet (Messages, WhatsApp,
       AirDrop, Instagram — every app installed). On desktop there's no
       sheet, so copy-link IS the off-app share. Exactly one of each. */
    const canNative = shareable && typeof navigator!=="undefined" && !!navigator.share;
    const items=shareable?[
      {label:"Into a lab",sub:"Drop it in a room. The author earns rep when it travels.",icon:"#",act:"lab"},
      ...(canNative?[{label:"Send off the app",sub:"Messages, WhatsApp, AirDrop — anywhere on your phone",icon:"↗",act:"native"}]:[]),
      {label:"Send inside TNL",sub:"Lands in their DMs here",icon:"✉",act:"dm"},
      {label:canNative?"Copy link":"Copy link to share",sub:link.replace(/^https?:\/\//,""),icon:"⧉",act:"copy"},
    ]:[
      {label:"Send inside TNL",sub:"Lands in their DMs here",icon:"✉",act:"dm"},
      {label:"Into a lab",sub:"Carry it across",icon:"#",act:"lab"},
    ];

    openPicker({eyebrow:shareable?"PUBLISHED WORK":"CHAT",title:"Where to?",
      note:shareable
        ?"This one has a public page — anyone can open it, no account."
        :"This is a lab message, not published work. No public link, by design.",
      items,
      onPick:async(it)=>{
        if(it.act==="dm"){
          const toItems=(people)=>people.map(u=>({label:u.displayName,sub:"@"+u.username+" · "+u.role,avatar:u.avatarUrl,username:u.username}));
          openPicker({eyebrow:"SEND",title:"Send to",search:"Search people…",loading:true,
            onSearch:async(q)=>toItems((await api.mentionable(q)).people),
            onPick:async(p2)=>{
              try{await api.sendPost(id,p2.username);toast("Sent to "+p2.label)}catch(e){toast(e.message)}}});
          try{const d=await api.mentionable("");
            if(PICKER){PICKER.items=toItems(d.people);PICKER.loading=false;render()}}catch(e){}
          return;
        }
        if(it.act==="lab"){
          const chans=[];
          for(const l of LABS)for(const c of l.channels){
            if(c.beatlab||(c.gate&&levelFor(myRep()).id<c.gate))continue;
            chans.push({label:"#"+c.label,sub:l.name,icon:"#",ch:c.id});
          }
          openPicker({eyebrow:"CROSS-LAB",title:"Share into",
            note:"The original author earns rep when their work travels.",
            items:chans,onPick:async(c)=>{
              try{await api.share(id,{channel:c.ch});toast("Shared to #"+c.ch)}catch(e){toast(e.message)}}});
          return;
        }
        if(it.act==="native"){
          const data={title:post.author.displayName+" on TNL LABS",
            text:post.body?post.body.slice(0,140):"Made in the labs.",url:link};
          try{await navigator.share(data)}
          catch(e){/* they cancelled — not an error */}
          return;
        }
        if(it.act==="copy"){
          try{
            await navigator.clipboard.writeText(link);
            toast("Link copied — paste it anywhere");
          }catch(e){
            /* clipboard API needs a secure context and a real gesture; when
               it's blocked, the select-all prompt still lets them copy. */
            await uiPrompt("Copy this link",{value:link,okLabel:"Done"});
          }
        }
      }});
  });
  document.querySelectorAll("[data-collab]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.collab;
    const toItems=(people)=>people.map(u=>({label:u.displayName,sub:"@"+u.username+" · "+u.role,avatar:u.avatarUrl,username:u.username}));
    openPicker({eyebrow:"TWO-SIDED",title:"Invite a collaborator",
      note:"They have to accept. When they do, you both earn +20.",
      search:"Search people…",loading:true,
      onSearch:async(q)=>toItems((await api.mentionable(q)).people),
      onPick:async(it)=>{
        try{await api.invite(id,it.username);toast("Invite sent to "+it.label)}catch(e){toast(e.message)}}});
    try{const d=await api.mentionable("");
      if(PICKER){PICKER.items=toItems(d.people);PICKER.loading=false;render()}}catch(e){}
  });
  document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=async()=>{try{await api.accept(b.dataset.accept);await refreshMe();toast("Collab confirmed — you both earned +20");render()}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-remix]").forEach(b=>b.onclick=()=>{
    if(guest())return needAccount("Join to remix — open their loop in your studio and make it yours.");
    const id=b.dataset.remix;
    const p=POSTS.find(x=>String(x.id)===id)||SRPOSTS.find(x=>String(x.id)===id)
      ||(SEARCHRES&&SEARCHRES.posts.find(x=>String(x.id)===id))
      ||(PROFILE&&[...PROFILE.posts,...PROFILE.collabs].find(x=>String(x.id)===id));
    if(!p||!p.beat)return toast("Couldn't load that loop");
    PROFILE=null;TAB="studio";render();
    setTimeout(()=>{if(window.TNLStudio&&TNLStudio.loadRemix)TNLStudio.loadRemix(p.beat,{postId:p.id,username:p.author.username,name:p.beat.name})},120);
  });
  document.querySelectorAll("[data-beatplay]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();if(window.TNLStudio)TNLStudio.preview(JSON.parse(b.dataset.beatplay))});
  document.querySelectorAll("[data-zoom]").forEach(el=>el.onclick=()=>{LIGHTBOX=el.dataset.zoom;render()});
  document.querySelectorAll("[data-discard]").forEach(b=>b.onclick=()=>{
    POSTS=POSTS.filter(x=>String(x.id)!==b.dataset.discard);renderRoomFeed()});
  document.querySelectorAll("[data-retry]").forEach(b=>b.onclick=async()=>{
    const p=POSTS.find(x=>String(x.id)===b.dataset.retry);if(!p||!p.retry)return;
    const r=p.retry;p.failed=false;p.pending=true;renderRoomFeed();
    try{
      const body={channel:CH.id,body:r.body,isWork:r.work};
      if(r.prep){const up=await uploadStream(dataUrlToBlob(r.prep.full));body.imageUrl=up.url;
        const th=await uploadStream(dataUrlToBlob(r.prep.thumb));body.thumbUrl=th.url;
        body.mediaW=r.prep.w;body.mediaH=r.prep.h}
      else if(r.vid){const up=await uploadStream(r.vid);
        if(up.kind==="video")body.videoUrl=up.url;else body.imageUrl=up.url}
      await api.post(body);
      POSTS=POSTS.filter(x=>x.id!==p.id);loadFeed(true);
    }catch(e){p.pending=false;p.failed=true;renderRoomFeed();toast(e.message)}});
  wireProfileLinks();   // covers .mention[data-u] too
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const p=POSTS.find(x=>String(x.id)===b.dataset.edit);if(!p)return;
    EDITID=p.id;render();const d=$("#draft");if(d){d.value=p.body||"";d.focus()}});
  document.querySelectorAll("[data-delpost]").forEach(b=>b.onclick=async()=>{
    if(!(await uiConfirm("Delete this post?","",{okLabel:"Delete",danger:true})))return;
    try{await api.delPost(b.dataset.delpost);toast("Deleted");loadFeed(true)}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-comments]").forEach(b=>b.onclick=async()=>{
    const id=+b.dataset.comments;
    if(OPENCOMMENTS===id){OPENCOMMENTS=null;CEDIT=null;return render()}
    OPENCOMMENTS=id;CEDIT=null;COMMENTS=[];render();
    try{COMMENTS=(await api.comments(id)).comments;render();setTimeout(()=>$("#cdraft")?.focus(),80)}catch(e){toast(e.message)}});
  const cs=$("#csend");if(cs){const go=async()=>{
    const t=$("#cdraft").value.trim();if(!t)return;
    const id=OPENCOMMENTS, editing=CEDIT;
    $("#cdraft").value="";
    if(!editing){
      // show it immediately
      COMMENTS=[...COMMENTS,{id:"tmp"+Date.now(),body:t,createdAt:Date.now(),editedAt:null,pending:true,
        author:{username:ME.username,displayName:ME.displayName,avatarUrl:ME.avatarUrl,role:ME.role,level:levelFor(ME.rep).id}}];
      const p=POSTS.find(x=>x.id===id);if(p)p.commentCount=(p.commentCount||0)+1;
      render();setTimeout(()=>$("#cdraft")?.focus(),40);
    }
    try{
      if(editing){await api.editComment(editing,t);CEDIT=null}
      else await api.addComment(id,t);
      COMMENTS=(await api.comments(id)).comments;
      render();setTimeout(()=>$("#cdraft")?.focus(),40);
    }catch(e){
      COMMENTS=COMMENTS.filter(c=>!c.pending);
      const p=POSTS.find(x=>x.id===id);if(p)p.commentCount=Math.max(0,(p.commentCount||1)-1);
      toast(e.message);render();
    }};
    cs.onclick=go;$("#cdraft").onkeydown=e=>{if(e.key==="Enter")go()}}
  const cc=$("#ccancel");if(cc)cc.onclick=()=>{CEDIT=null;render()};
  const cj=$("#cjoinb");if(cj)cj.onclick=()=>needAccount("Give real feedback. It's where most collabs start.");
  document.querySelectorAll("[data-cedit]").forEach(b=>b.onclick=()=>{CEDIT=+b.dataset.cedit;render();setTimeout(()=>$("#cdraft")?.focus(),80)});
  document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=async()=>{
    if(!(await uiConfirm("Delete this comment?","",{okLabel:"Delete",danger:true})))return;
    try{await api.delComment(b.dataset.cdel);COMMENTS=(await api.comments(OPENCOMMENTS)).comments;loadFeed(true);render()}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-report]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.report;
    openPicker({eyebrow:"REPORT",title:"What's wrong?",
      items:["Spam","Harassment","Stolen work","Nudity or gore","Something else"].map(r=>({label:r,icon:"⚐",reason:r})),
      onPick:async(it)=>{try{await api.report({postId:id,reason:it.reason});toast("Reported — thank you")}catch(e){toast(e.message)}}});
  });
  wireProfileLinks();
}
function wireSheet(){
  const bg=$("#sheetbg");if(!bg)return;
  bg.onclick=e=>{if(e.target===bg){PROFILE=null;EDITING=false;render()}};
  $("#sheetx").onclick=()=>{PROFILE=null;EDITING=false;render()};
  const fb=$("#followb");if(fb)fb.onclick=async()=>{
    if(guest())return needAccount("Follow the people you want to build with.");
    const u=PROFILE.user.username;
    // optimistic — the button responds now, the server catches up
    PROFILE.youFollow=!PROFILE.youFollow;
    PROFILE.followers+=PROFILE.youFollow?1:-1;
    render();
    try{await api.follow(u);PROFCACHE.delete(u);const d=await api.profile(u);
      if(PROFILE&&PROFILE.user.username===u){PROFILE=d;PROFCACHE.set(u,d);render()}}
    catch(e){toast(e.message);PROFCACHE.delete(u)}};
  const lo=$("#logoutb");if(lo)lo.onclick=()=>{
    TOKEN=null;ME=null;PROFILE=null;UNREADS={};UNREAD=0;DMUNREAD=0;applyAccent((ACCENTS.lab||{}).hex);
    localStorage.removeItem("tnl-token");
    if(es)es.close();
    TAB="showroom";GATE=null;render();toast("Signed out")};
  const mb=$("#msgb");if(mb)mb.onclick=()=>{if(guest())return needAccount("Message people directly. Most collabs start with a DM.");openDM(PROFILE.user.username)};
  const bb=$("#blockb");if(bb)bb.onclick=async()=>{
    if(!(await uiConfirm("Block "+PROFILE.user.displayName+"?","You won't see each other's work.",{okLabel:"Block",danger:true})))return;
    try{const d=await api.block(PROFILE.user.username);toast(d.blocked?"Blocked":"Unblocked");PROFILE=null;render()}catch(e){toast(e.message)}};
  const ru=$("#reportu");if(ru)ru.onclick=()=>{
    const un=PROFILE.user.username;
    openPicker({eyebrow:"REPORT",title:"Why?",
      items:["Spam","Harassment","Stolen work","Impersonation","Something else"].map(r=>({label:r,icon:"⚐",reason:r})),
      onPick:async(it)=>{try{await api.report({username:un,reason:it.reason});toast("Reported — thank you")}catch(e){toast(e.message)}}});
  };

  document.querySelectorAll("[data-ptab]").forEach(b=>b.onclick=async()=>{PTAB=b.dataset.ptab;render();
    if(PTAB==="shop"&&PROFLISTINGS===null&&PROFILE){try{const d=await api.mkt("seller="+encodeURIComponent(PROFILE.user.username));PROFLISTINGS=d.listings||[];render()}catch(e){PROFLISTINGS=[];render()}}});

  const pp=$("#profpost");if(pp)pp.onclick=()=>{PCOMPOSE={body:"",imgs:[],busy:false};pushView("compose");render()};
  const eb=$("#editb");if(eb)eb.onclick=()=>{EDITING=true;EDITACCENT=PROFILE.user.accent||"lab";
    EDITROLES=(PROFILE.user.roles&&PROFILE.user.roles.length?[...PROFILE.user.roles]:[PROFILE.user.role]).filter(Boolean);render()};
  document.querySelectorAll("[data-accent]").forEach(b=>b.onclick=()=>{
    EDITACCENT=b.dataset.accent;
    applyAccent((ACCENTS[EDITACCENT]||{}).hex);   // see it immediately, not after saving
    render();
  });
  const avb=$("#avbtn");if(avb)avb.onclick=()=>$("#avin").click();
  const avi=$("#avin");if(avi)avi.onchange=async()=>{
    const f=avi.files&&avi.files[0];if(!f)return;avi.value="";
    try{const data=await compressImage(f,600,.85);const d=await api.avatar(data);
      ME=d.user;PROFCACHE.delete(ME.username);PROFILE=await api.profile(ME.username);toast("Photo updated");render()}catch(e){toast(e.message)}};
  /* pubtoggle removed in 064 — every page is public. */
  const ec=$("#ed-cancel");if(ec)ec.onclick=()=>{EDITING=false;applyAccent(ME.accentHex);render()};
  document.querySelectorAll("[data-er]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.er;
    if(EDITROLES.includes(r))EDITROLES=EDITROLES.filter(x=>x!==r);
    else if(EDITROLES.length<5)EDITROLES=[...EDITROLES,r];
    else toast("Up to 5 roles");
    render()});
  const es_=$("#ed-save");if(es_)es_.onclick=async()=>{
    try{
      const d=await api.updateMe({displayName:$("#ed-name").value,bio:$("#ed-bio").value,link:$("#ed-link").value,roles:EDITROLES,accent:EDITACCENT});
      ME=d.user;EDITING=false;applyAccent(ME.accentHex);PROFCACHE.delete(ME.username);PROFILE=await api.profile(ME.username);toast("Profile updated");render();
    }catch(e){toast(e.message)}};

  // beat playback + opening a piece from the portfolio
  document.querySelectorAll("[data-beatplay]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();if(window.TNLStudio)TNLStudio.preview(JSON.parse(b.dataset.beatplay))});
  document.querySelectorAll("[data-openpost]").forEach(el=>el.onclick=async(e)=>{
    if(e.target.closest("button,a,video,input,textarea"))return;   // let the card's own controls work
    const id=Number(el.dataset.openpost);
    /* A grid tile is a thumbnail, not the work. Open the whole post over the
       profile — every frame, the caption, the sound, the comments — and leave the
       profile underneath so closing puts you back where you were. */
    const p=(PROFILE&&[...PROFILE.posts,...PROFILE.collabs].find(x=>Number(x.id)===id))
      ||(SEARCHRES&&(SEARCHRES.posts||[]).find(x=>Number(x.id)===id))
      ||(POSTS||[]).find(x=>Number(x.id)===id)
      ||(SRPOSTS||[]).find(x=>Number(x.id)===id);
    if(!p)return;
    POSTOPEN=p;OPENCOMMENTS=id;COMMENTS=[];render();
    try{COMMENTS=(await api.comments(id)).comments;render()}catch(err){}
  });
}

/* ---- boot ---- */
/* Runs every 20s in the background. It must NEVER call render() — a full
   rebuild mid-action detaches the file input you just opened, wipes text
   you're typing, and jumps your scroll. That's what made image upload fail
   "the first few tries": a poll landing while the picker was open. Paints
   the two badges surgically instead. */
async function refreshBadges(){
  if(!ME)return;
  if(!ME.emailVerified){
    try{const st=await api.authStatus();
      if(st.verified){await refreshMe();toast("Email confirmed — you're in");paintVerifyBar()}
    }catch(e){}
  }
  try{const [n,d]=await Promise.all([api.notifs(),api.dmList()]);
    UNREAD=n.unread;DMUNREAD=d.unreadTotal;
    paintBadges();
    loadUnreads();
  }catch(e){/* offline */}
}
function paintBadges(){
  const set=(sel,count)=>{
    const b=$(sel);if(!b)return;
    let el=b.querySelector(".badge");
    if(count&&!el){el=document.createElement("span");el.className="badge";b.appendChild(el)}
    if(count&&el)el.textContent=count>9?"9+":count;
    else if(el)el.remove();
  };
  set("#notifBtn",UNREAD);
  set("#dmBtn",DMUNREAD);
}
function paintVerifyBar(){
  const bar=document.querySelector(".verifybar");
  if(bar&&ME&&ME.emailVerified)bar.remove();
}
(async()=>{
  try{const d=await api.levels();LEVELS=d.levels;if(d.accents)ACCENTS=d.accents;if(d.site)SITE=d.site}catch(e){/* offline default */}
  if(TOKEN)await refreshMe();          // invalid token just leaves ME null -> guest
  if(ME&&ME.accentHex)applyAccent(ME.accentHex);
  if(ME){
    startStream();refreshBadges();loadUnreads();
    setInterval(refreshBadges,20000);
    const p=new URLSearchParams(location.search);
    if(p.get("connect")==="done"){try{await api.connectStatus();await refreshMe();
      toast(ME.payoutsReady?"Payouts connected":"Stripe needs a bit more info")}catch(e){}
      history.replaceState({},"","/")}
    if(p.get("checkout")==="paid"){toast("Paid — the seller's been told to ship");history.replaceState({},"","/")}
    if(p.get("checkout")==="failed"){toast("Payment didn't go through");history.replaceState({},"","/")}
    if(p.get("dm")){const who=p.get("dm");history.replaceState({},"","/");openDM(who)}   // admin Nudge lands here
  }
  try{MKTMETA=await api.mktMeta()}catch(e){}   // public — guests see the Market too
  // deep links — a shared /u/ or /m/ URL should land where it says
  const path=location.pathname;
  const mu=/^\/u\/([a-z0-9._]+)$/i.exec(path);
  const mm=/^\/m\/(\d+)$/.exec(path);
  if(mu){openProfile(mu[1])}
  else if(mm){TAB="market";MKTVIEW="detail";
    try{const d=await api.mktOne(mm[1]);MKTONE=d.listing;MKTOFFERS=d.offers||[]}catch(e){}}
  render();
  initHistory();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
})();
</script>
