<!DOCTYPE html>
<!-- TNL LABS admin v2.1 — 2026-09-29. Shell and styles; the app is public/admin-app/*.js; colours from /palette.css -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TNL LABS — Admin</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tnl-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<!-- every colour: src/palette.js, served as /palette.css -->
<link rel="stylesheet" href="/palette.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
svg.di{display:inline-block;vertical-align:-.16em;flex-shrink:0}
.dim{color:var(--dim)}.mono{font-size:11px;letter-spacing:.02em;color:var(--dim)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.gate h1{font-size:24px;margin:10px 0 6px}.gate p{color:var(--dim);max-width:300px;margin:0 auto 16px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;max-width:1100px;margin:0 auto}
.brand{font-weight:800;font-size:15px;letter-spacing:.01em;flex:1}.brand i{font-style:normal;color:var(--green)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--tx2);flex-shrink:0}
.tabs .pill{padding:7px 11px;font-size:12.5px}
.pill.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.pill b{background:var(--fill);color:var(--on-fill);border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.pill.sm{padding:5px 11px;font-size:12px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--tx);color:var(--bg);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line2)}
.btn.fill{background:var(--fill);color:var(--on-fill)}
.btn.danger{background:none;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 45%,transparent)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.4}
.ib{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line2);color:var(--tx)}
.in,.sel{width:100%;background:var(--el);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:16px;outline:none}
textarea.in{border-radius:16px;resize:vertical;min-height:84px;line-height:1.45}
.sel{width:auto;padding:8px 12px;font-size:13px;appearance:none;-webkit-appearance:none}
.in:focus,.sel:focus{border-color:var(--line2)}
.empty{color:var(--dim);text-align:center;padding:28px 12px;font-size:13px}

/* sections */
h2.sec{font-size:13px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec .mono{font-weight:400;margin-left:auto}
.panel{background:var(--card);border:1px solid var(--line);padding:14px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.wrapx{flex-wrap:wrap}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.filters::-webkit-scrollbar{display:none}

/* numbers */
.kpi{background:var(--card);border:1px solid var(--line);padding:12px 13px 10px;min-width:0}
.kpi .k{font-size:12px;color:var(--dim)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.kpi .d b{color:var(--tx);font-weight:700}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
.spark i{flex:1;background:var(--line2);min-height:1px}
.spark i:last-child{background:var(--tx)}

/* bar chart — one series, ink; the latest bar in reagent */
.chart{position:relative;background:var(--card);border:1px solid var(--line);padding:14px 14px 8px}
.plot{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line2)}
.plot .b{flex:1;display:flex;align-items:flex-end;height:100%;min-width:2px}
.plot .b i{display:block;width:100%;background:var(--tx);min-height:1px}
.plot .b.last i{background:var(--fill);box-shadow:inset 0 0 0 1px var(--green)}
.plot .b:hover i{background:var(--green)}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);padding-top:5px}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--bg);font-size:12px;padding:5px 8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.tip[hidden]{display:none}

/* lists */
.needs{display:flex;flex-direction:column}
.need{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
.need .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex-shrink:0}
.need.high .dot{background:var(--red)}.need.high .t{font-weight:700}
.need .t{flex:1;min-width:0}
.need .ppl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:3px 9px 3px 3px;font-size:12px}
.chip .av{width:20px;height:20px;font-size:8px}
.clear{display:flex;align-items:center;gap:10px;color:var(--dim);padding:6px 2px}
.clear svg{color:var(--green)}
.av{width:36px;height:36px;border-radius:50%;background:var(--el);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;object-fit:cover;overflow:hidden}
.av.lg{width:64px;height:64px;font-size:18px}
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}
button.li:active,button.li:hover{background:var(--el)}
.li .b{flex:1;min-width:0}
.li .b b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .b span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li .r{font-size:12px;color:var(--dim);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:1px 7px;margin-left:5px;vertical-align:1px;color:var(--tx2)}
.tag.on{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.tag.warn{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}

/* the collab loop */
.loop{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.step .tr{height:18px;background:var(--el);position:relative}
.step .tr i{position:absolute;inset:0 auto 0 0;background:var(--tx)}
.step:last-child .tr i{background:var(--fill)}
.step .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stuck{grid-column:1/-1;font-size:12px;color:var(--dim);margin:-2px 0 4px 128px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
@media(max-width:520px){.step{grid-template-columns:96px 1fr 36px}.stuck{margin-left:0}}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--dim);padding:0 8px 7px 0;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* posts */
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.posts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.pc .im{aspect-ratio:1;background:var(--el);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--dim);font-size:12.5px;padding:10px;text-align:left}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .im p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx2)}
.pc .meta{padding:8px 9px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.pc .acts{display:flex;gap:6px;padding:0 9px 9px}
.report{background:var(--card);border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));padding:12px;display:flex;gap:12px;margin-bottom:8px}

/* the person drawer */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:flex-end}
.drawer{width:100%;max-width:460px;height:100%;height:100dvh;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 40px}
.drawer .hd{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.drawer .hd b{font-size:18px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:10px 0}
.stats div{background:var(--card);padding:9px 10px}.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--dim)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.thumbs div{aspect-ratio:1;background:var(--el);overflow:hidden;font-size:11px;color:var(--dim);padding:6px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* settings */
.set{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.set .t{flex:1}.set .t b{display:block;font-weight:600}.set .t span{font-size:12.5px;color:var(--dim)}
.sw{position:relative;width:42px;height:25px;border-radius:999px;background:var(--line2);flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--bg);transition:transform .15s}
.sw.on{background:var(--fill)}.sw.on::after{transform:translateX(17px)}
.warnbox{border:1px solid color-mix(in srgb,var(--red) 40%,transparent);color:var(--tx2);padding:10px 12px;font-size:12.5px;margin:8px 0}
label.l{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
details.more{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}
details.more summary{cursor:pointer;font-weight:700;font-size:13px;padding:12px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}

/* studio (ported from v1) */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
@media(min-width:760px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);padding:12px}.card .k{font-size:12px;color:var(--dim)}
.card .v{font-size:22px;font-weight:700;margin:3px 0}.card .s{font-size:11.5px;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:7px}.bar{display:flex;align-items:center;gap:9px;font-size:12px}
.bar .lab{width:96px;flex-shrink:0;font-size:11px;color:var(--dim)}.bar .track{flex:1;height:8px;background:var(--el)}
.bar .fill{height:100%;background:var(--tx)}.bar .n{width:30px;text-align:right;font-size:11px}
.studio .panel{margin-bottom:10px}.studio h3{font-size:12.5px;margin-bottom:10px}.studio .hero{display:none}
.rep{border:1px solid var(--line2);padding:10px 12px;margin:10px 0}.rep .rt{font-weight:700}.rep .rb{font-size:12.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);font-weight:700;font-size:13px;border-radius:999px;padding:9px 18px;z-index:90;max-width:90vw}
.modal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--line2);width:100%;max-width:380px;padding:18px}
.modal .box b{display:block;font-size:16px;margin-bottom:6px}.modal .box p{color:var(--dim);font-size:13px;white-space:pre-line}
.modal .box .in{margin-top:10px}.modal .row{justify-content:flex-end;margin-top:14px}
</style>
</head>
<body><div id="app"></div><div id="layer"></div>
<script src="/admin-app/1-core.js?v=2.0"></script>
<script src="/admin-app/2-today.js?v=2.0"></script>
<script src="/admin-app/3-people.js?v=2.0"></script>
<script src="/admin-app/4-content.js?v=2.0"></script>
<script src="/admin-app/5-market.js?v=2.0"></script>
<script src="/admin-app/6-system.js?v=2.0"></script>
<script src="/admin-app/7-studio.js?v=2.0"></script>
<script>boot()</script>
</body>
</html>
