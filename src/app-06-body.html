</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
/* Registered before everything else so it can catch a failure in the main
   script itself. A white-on-black stack trace beats a black rectangle:
   without this, ANY error at load looks identical to a dead server. */
(function(){
  var shown=false;
  /* 2026-10-27: "This is what people see" — an iPad on the tournament,
     already open and working, wiped by "Script error.". That message is all a
     browser gives for an error in someone else's script (a Safari extension,
     a wallet, Instagram's or Facebook's in-app browser injecting its own
     code), and none of it is LABS. So: someone else's error is ignored, and
     once the app is up (LABS_UP, end of boot in app-19-feed-boot) an error
     of ours is reported but never replaces the screen people are using. */
  function foreign(msg,file,line){
    msg=String(msg||"");
    if(/^Script error\.?$/i.test(msg))return true;
    if(file&&!/^https?:/i.test(file))return true;                                  // chrome-extension://, iabjs://, webkit-masked-url://
    if(file&&file.indexOf(location.origin)!==0)return true;                         // another site's script
    if(/_META\b|webkit\.messageHandlers|Java object is gone|ethereum|evmAsk|__gCrWeb|instantSearchSDK/i.test(msg))return true;
    return false;
  }
  function report(what,where){
    try{
      fetch("/api/client-error",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:String(what).slice(0,400),detail:String(where||"").slice(0,400),path:location.pathname})}).catch(function(){});
    }catch(e){}
  }
  function crash(what,where){
    if(window.LABS_UP){report(what,where);return}
    if(shown)return; shown=true;
    /* Tell the server. Otherwise a crash only exists if the person who hit
       it bothers to screenshot it — and most people just leave. */
    report(what,where);
    try{
      document.getElementById("app").innerHTML=
        '<div style="padding:28px 16px;font-family:\'Helvetica Neue\',Helvetica,Archivo,Arial,sans-serif;color:var(--tx)">'+
        '<div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)"><span style="color:var(--green)">//</span> LABS</div>'+
        '<h1 style="font-size:30px;line-height:34px;letter-spacing:-.02em;margin:14px 0 8px">Something broke</h1>'+
        '<p style="color:var(--dim);font-size:15px;line-height:21px;margin-bottom:14px">'+
        'The app hit an error while loading. This is a bug, not you.</p>'+
        '<pre style="background:var(--el);border:1px solid rgba(var(--fg-rgb),.15);padding:12px;'+
        'font-size:12px;font-family:inherit;color:var(--tx);white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:40vh">'+
        String(what)+(where?"\n\n"+where:"")+'</pre>'+
        '<button onclick="(async()=>{try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}'+
        'if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}}'+
        'catch(e){};location.reload(true)})()" '+
        'style="margin-top:14px;background:var(--tx);color:var(--bg);border:none;border-radius:999px;padding:14px 26px;font-weight:700;font-size:15px;font-family:inherit">'+
        'Clear cache &amp; reload</button>'+
        '<p style="color:var(--dim);font-size:12px;margin-top:14px;line-height:16px">'+
        'If this persists, screenshot this message — it says exactly what went wrong.</p></div>';
    }catch(e){ document.body.innerHTML="<pre style=\"color:var(--tx);padding:20px;font-family:inherit\">"+String(what)+"</pre>" }
  }
  /* Only fire for things that actually break the app. Media playback throws
     constantly and harmlessly: AbortError every time a play() is interrupted
     by a scroll or a re-render, NotAllowedError when autoplay is blocked.
     Showing a crash screen for those is worse than showing nothing. */
  function benign(err){
    var n = (err && err.name) || "";
    var m = String((err && err.message) || err || "");
    return n==="AbortError" || n==="NotAllowedError" || n==="NotSupportedError"
      || /operation was aborted|play\(\) request|interrupted by|removed from the document|user denied|load failed/i.test(m);
  }
  window.addEventListener("error",function(e){
    if(benign(e.error)) return;
    /* Chrome's "ResizeObserver loop completed with undelivered notifications"
       is a warning raised as an error event (no error object) when a layout
       settles over two frames — a video's shape changing did it. It breaks
       nothing; it used to replace the whole app with this screen. */
    if(/ResizeObserver loop/i.test(String(e.message||""))) return;
    // an <img>/<video> that 404s fires error on the ELEMENT, not the window
    if(e.target && e.target !== window && e.target.tagName) return;
    if(foreign(e.message||(e.error&&e.error.message),e.filename,e.lineno)) return;
    crash(e.message||e.error, e.filename?(e.filename.split("/").pop()+":"+e.lineno+":"+e.colno):"");
  }, true);
  window.addEventListener("unhandledrejection",function(e){
    if(benign(e.reason)) { e.preventDefault(); return; }
    if(foreign((e.reason&&e.reason.message)||e.reason,"")) return;
    crash((e.reason&&e.reason.message)||e.reason,"unhandled promise rejection");
  });
})();
</script>
